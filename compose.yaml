services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tournaments
      POSTGRES_USER: tournaments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tournament-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournaments -d tournaments"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Tournaments: Host=db;Database=tournaments;Username=tournaments;Password=${POSTGRES_PASSWORD}
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Scheduler__BaseUrl: http://scheduler:8000
      Scheduler__TimeoutSeconds: 10
      ProposalKeysPath: /keys
      Notifications__WhatsApp__Enabled: ${NOTIFICATIONS_WHATSAPP_ENABLED:-false}
      Notifications__WhatsApp__BaseUrl: ${NOTIFICATIONS_WHATSAPP_BASE_URL:-}
      Notifications__WhatsApp__ApiKey: ${NOTIFICATIONS_WHATSAPP_API_KEY:-}
      Notifications__WhatsApp__InstanceName: ${NOTIFICATIONS_WHATSAPP_INSTANCE_NAME:-}
      Notifications__WhatsApp__WebhookSecret: ${NOTIFICATIONS_WHATSAPP_WEBHOOK_SECRET:-}
      ConnectionStrings__Tournaments: Host=db;Database=tournaments;Username=tournaments;Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5094:8080"
    volumes:
      - proposal-keys:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    build: ./scheduler
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tournament-data:
  proposal-keys:
