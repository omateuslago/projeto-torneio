<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" routerLink="/campeonatos">
      <img class="brand-logo" src="assests/06-geometrica.svg" alt="Brakvyo" />
    </a>
    <button
      class="menu-toggle secondary"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      (click)="toggleMenu()"
    >
      <span aria-hidden="true">{{ menuOpen() ? '×' : '☰' }}</span>
      <span>{{ menuOpen() ? 'Fechar' : 'Menu' }}</span>
    </button>
    <nav id="main-navigation" [class.is-open]="menuOpen()" aria-label="Navegação principal">
      <a routerLink="/campeonatos" routerLinkActive="active">Campeonatos</a>
      <a routerLink="/equipes" routerLinkActive="active">Equipes</a>
      @if (auth.isAuthenticated()) {
        <a
          class="notification-link"
          routerLink="/notificacoes"
          routerLinkActive="active"
          aria-label="Notificações"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
          </svg>
          <span class="notification-link__label">Notificações</span>
        </a>
        <div class="account-menu" (click)="$event.stopPropagation()">
          <button
            #userMenuButton
            type="button"
            class="account-menu__trigger secondary"
            aria-haspopup="menu"
            [attr.aria-expanded]="userMenuOpen()"
            aria-controls="account-menu-options"
            (click)="toggleUserMenu()"
          >
            <span>{{ auth.user().displayName }}</span>
            <span aria-hidden="true">⌄</span>
          </button>
          @if (userMenuOpen()) {
            <div id="account-menu-options" class="account-menu__options" role="menu">
              <a role="menuitem" routerLink="/minha-conta/notificacoes">Preferências</a>
              <button type="button" role="menuitem" (click)="logout()">Sair</button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Entrar</a>
      }
    </nav>
  </div>
</header>
<main id="conteudo" class="shell" tabindex="-1"><router-outlet /></main>
