<section class="panel" aria-labelledby="register-title">
  <h1 id="register-title">Criar conta</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label
      >Nome<input formControlName="displayName" maxlength="120" autocomplete="name" required
    /></label>
    <label>Email<input type="email" formControlName="email" autocomplete="email" required /></label>
    <label
      >Senha<input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        minlength="8"
        required
    /></label>
    <label
      >Confirmar senha<input
        type="password"
        formControlName="confirmation"
        autocomplete="new-password"
        required
    /></label>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button [disabled]="busy() || form.invalid">{{ busy() ? 'Criando…' : 'Criar conta' }}</button>
  </form>
  <p>Já possui conta? <a routerLink="/login">Entrar</a></p>
</section>
