<div class="auth-layout">
  <section class="panel auth-card" aria-labelledby="register-title">
    <div class="auth-card__heading">
      <span>Brakvyo</span>
      <h1 id="register-title">Crie sua conta</h1>
      <p>Comece a organizar campeonatos e equipes.</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label
        >Nome<input formControlName="displayName" maxlength="120" autocomplete="name" required
      /></label>
      <label
        >Email<input type="email" formControlName="email" autocomplete="email" required
      /></label>
      <label
        >Senha<input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          minlength="8"
          required
      /></label>
      <label
        >Confirmar senha<input
          type="password"
          formControlName="confirmation"
          autocomplete="new-password"
          required
      /></label>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button [disabled]="busy() || form.invalid">{{ busy() ? 'Criando…' : 'Criar conta' }}</button>
    </form>
    <p>
      Já possui conta?
      <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl: returnUrl } : undefined"
        >Entrar</a
      >
    </p>
  </section>
</div>
